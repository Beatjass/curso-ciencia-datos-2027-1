[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clinlab"
version = "0.1.0"
description = "Análisis de pacientes de Synthea convertido en paquete"
requires-python = ">=3.0"
dependencies = [
    "pandas",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pandera"
]

[tool.pytest.ini_options]
addopts = "--cov=clinlab --cov-report=term-missing"