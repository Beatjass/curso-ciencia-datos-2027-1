[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pf_depresion_omop"
version = "0.9.0"
description = "Pipeline ETL para mapear egresos hospitalarios por depresión a OMOP CDM"
requires-python = ">=3.0"
dependencies = [
    "polars",
    "pyarrow",
    "pandas",
    "matplotlib",
    "seaborn",
    "scipy",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "pytest",
    "ruff",
]

[project.optional-dependencies]
dev = [
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C4", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


