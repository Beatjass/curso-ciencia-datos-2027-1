version: '3.8'

services:
  omop_db:
    image: postgres:15
    container_name: pf_depresion_omop_postgres
    environment:
      POSTGRES_USER: admin_dep_omop
      POSTGRES_PASSWORD: proyecto_final_26
      POSTGRES_DB: omop_cdm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pf_depresion_omop_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@omop.com
      PGADMIN_DEFAULT_PASSWORD: proyecto_final_26
    ports:
      - "5050:80"
    depends_on:
      - omop_db

volumes:
  postgres_data:
