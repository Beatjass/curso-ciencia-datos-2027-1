services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: beatjass
      POSTGRES_PASSWORD: clinlab07
      POSTGRES_DB: clindb
    ports:
      - "5432:5432" #Se agrego para la actividad 2
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatjass -d clindb"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080" #Puerto host:puerto_contenedor
    depends_on:
      - db

  jupyter:
    image: jupyter/scipy-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
