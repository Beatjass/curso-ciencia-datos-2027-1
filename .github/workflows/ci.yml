name: Pipeline CI - Depresión OMOP

on:
  push:
    paths:
      - 'pf_depresion_omop/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'pf_depresion_omop/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pf_depresion_omop

    steps:
    - uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install polars pytest ruff
        
    - name: Validar formato con Ruff
      run: ruff format .
      
    - name: Ejecutar pruebas con Pytest
      run: pytest tests/
