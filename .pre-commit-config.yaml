repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.4
    hooks:
      #Ejecutar ruff
      - id: ruff
        args: [ --fix ]
      #Ejecutar el formateador de código
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      #Ejecuta la revisión de tipos estáticos
      - id: mypy
        additional_dependencies: [ pandas-stubs, pytest ]